services:
  postgres:
    image: postgres:15-alpine
    container_name: cloud-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloud-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: cloud-pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
  #     PGADMIN_CONFIG_SERVER_MODE: 'False'
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - cloud-network
  #   restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cloud-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cloud-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: proxmox-iaas-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloud-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  celery_worker:
    build:
      context: .
      dockerfile: app/Dockerfile.worker
    container_name: celery_worker-proxmox-iaas-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      PYTHONPATH: /app
      PROXMOX_URL: ${PROXMOX_URL}
      PROXMOX_USERNAME: ${PROXMOX_USERNAME}
      PROXMOX_TOKEN: ${PROXMOX_TOKEN}
      PROXMOX_NODE: ${PROXMOX_NODE}
      PROXMOX_STORAGE: ${PROXMOX_STORAGE:-local-lvm}
      OPNSENSE_TEMPLATE_ID: ${OPNSENSE_TEMPLATE_ID}
      OPNSENSE_BOOTSTRAP_KEY: ${OPNSENSE_BOOTSTRAP_KEY}
      OPNSENSE_BOOTSTRAP_SECRET: ${OPNSENSE_BOOTSTRAP_SECRET}
      WIREGUARD_FIELD_ENCRYPTION_KEY: ${WIREGUARD_FIELD_ENCRYPTION_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    depends_on:
      - redis
      - postgres
    networks:
      - cloud-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:

networks:
  cloud-network:
    driver: bridge
